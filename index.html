<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>まいにち家計簿</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="theme-color" content="#2e7a5a">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="description" content="カード払いの引き落とし日と口座残高まで自動で計算する、スマホの家計簿。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
:root{
  --paper:#f2f5f4;--sheet:#fff;--ink:#1c2930;--muted:#647479;--rule:#d8e2e3;
  --red:#c8412d;--red-soft:#f7e4e0;--blue:#2565b8;--blue-soft:#e1ebf7;
  --acc:#2e7a5a;--acc-soft:#e0efe8;--card:#6a4fb0;--card-soft:#ece6f7;--sav:#4a4fa8;--sav-soft:#e6e6f6;
  --c1:#6a6fc4;--c2:#2e8a6a;--c3:#e39a2d;--c4:#3a8fb0;--c5:#c8412d;--c6:#b0568f;--c7:#9a7b3c;--c8:#5f8f3a;--cx:#8a9aa0;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"Nunito","Helvetica Neue",Arial,system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#12191c;--sheet:#1a2428;--ink:#e3ebec;--muted:#8e9fa4;--rule:#2a383c;
  --red:#ef7d69;--red-soft:#3b2421;--blue:#6aa6f0;--blue-soft:#1d2c40;
  --acc:#5ec198;--acc-soft:#1b3329;--card:#b49af0;--card-soft:#2b2440;--sav:#9a9ef0;--sav-soft:#262842;
  --c1:#9a9ef0;--c2:#5ec198;--c3:#f0b45a;--c4:#6cc0e0;--c5:#ef7d69;--c6:#e08ac0;--c7:#d0b070;--c8:#9ad070;--cx:#7f9196;color-scheme:dark}}
:root[data-theme=dark]{
  --paper:#12191c;--sheet:#1a2428;--ink:#e3ebec;--muted:#8e9fa4;--rule:#2a383c;
  --red:#ef7d69;--red-soft:#3b2421;--blue:#6aa6f0;--blue-soft:#1d2c40;
  --acc:#5ec198;--acc-soft:#1b3329;--card:#b49af0;--card-soft:#2b2440;--sav:#9a9ef0;--sav-soft:#262842;
  --c1:#9a9ef0;--c2:#5ec198;--c3:#f0b45a;--c4:#6cc0e0;--c5:#ef7d69;--c6:#e08ac0;--c7:#d0b070;--c8:#9ad070;--cx:#7f9196;color-scheme:dark}
:root[data-acc=blue]{--acc:#2565b8;--acc-soft:#e1ebf7}
:root[data-acc=pink]{--acc:#c0487e;--acc-soft:#f8e3ee}
:root[data-acc=orange]{--acc:#c0621a;--acc-soft:#f9e8d9}
:root[data-acc=purple]{--acc:#6a4fb0;--acc-soft:#ece6f7}
:root[data-acc=gray]{--acc:#4f5d63;--acc-soft:#e6eaeb}
@media (prefers-color-scheme:dark){
:root:not([data-theme=light])[data-acc=blue]{--acc:#6aa6f0;--acc-soft:#1d2c40}
:root:not([data-theme=light])[data-acc=pink]{--acc:#f08cbc;--acc-soft:#3a2130}
:root:not([data-theme=light])[data-acc=orange]{--acc:#f0a35e;--acc-soft:#3a2a1a}
:root:not([data-theme=light])[data-acc=purple]{--acc:#b49af0;--acc-soft:#2b2440}
:root:not([data-theme=light])[data-acc=gray]{--acc:#b0bec3;--acc-soft:#263034}
}
:root[data-theme=dark][data-acc=blue]{--acc:#6aa6f0;--acc-soft:#1d2c40}
:root[data-theme=dark][data-acc=pink]{--acc:#f08cbc;--acc-soft:#3a2130}
:root[data-theme=dark][data-acc=orange]{--acc:#f0a35e;--acc-soft:#3a2a1a}
:root[data-theme=dark][data-acc=purple]{--acc:#b49af0;--acc-soft:#2b2440}
:root[data-theme=dark][data-acc=gray]{--acc:#b0bec3;--acc-soft:#263034}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(150px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:.04em}
h2{font-size:1.05rem}
.label{font-size:.72rem;letter-spacing:.1em;color:var(--muted);font-weight:500}
.note{font-size:.8rem;color:var(--muted)}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px}
.pad{padding:16px;display:flex;flex-direction:column;gap:12px}
.minus{color:var(--red)}.plus{color:var(--blue)}
.link{background:none;border:0;padding:4px 0;color:var(--acc);font-size:.85rem;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.top h1{font-size:1.3rem;line-height:1.2;overflow-wrap:anywhere}
.top .today{font-size:.75rem;color:var(--acc);font-weight:700}
.setbtn{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 14px;font-size:.82rem;flex:0 0 auto}
/* strip */
.strip{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.total .big{font-size:1.7rem;font-weight:700}
.accs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.accs::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--rule);border-radius:10px;padding:5px 10px;display:flex;flex-direction:column;line-height:1.3;background:var(--paper);text-align:left}
.chip small{font-size:.68rem;color:var(--muted)}
.chip b{font-size:.9rem}
.nextbox{background:var(--card-soft);border-radius:10px;padding:10px 12px;font-size:.85rem;display:flex;flex-direction:column;gap:4px}
.nextbox .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.nextbox ul{margin:0;padding:0;list-style:none}
.nextbox li{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem}
.warn{background:var(--red-soft);color:var(--red);border-radius:10px;padding:8px 12px;font-size:.84rem;font-weight:700}
.ok{font-size:.8rem;color:var(--muted)}
/* month bar */
.monthbar{display:flex;align-items:center;gap:8px}
.monthbar .t{flex:1;text-align:center;font-family:var(--f-display);font-size:1.15rem;font-weight:700}
.monthbar .t small{font-size:.75rem;color:var(--muted);margin-right:4px}
.nav{width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);font-size:1.3rem;line-height:1}
.todaybtn{border:1px solid var(--acc);color:var(--acc);background:none;border-radius:999px;padding:4px 10px;font-size:.78rem}
/* summary */
.sum3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:10px 6px}
.sum3>div{display:flex;flex-direction:column}
.sum3 .v{font-weight:700;font-size:1rem}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);padding:6px}
.cal .wd{text-align:center;font-size:.7rem;color:var(--muted);padding:4px 0}
.cal .wd.sun,.cell.sun .d{color:var(--red)}.cal .wd.sat,.cell.sat .d{color:var(--blue)}
.cell{min-height:64px;border:0;background:none;border-top:1px solid var(--rule);padding:3px 2px;display:flex;flex-direction:column;align-items:stretch;text-align:right;gap:1px;font-size:.66rem;line-height:1.2}
.cell .d{text-align:left;font-size:.78rem;font-weight:700;padding-left:3px}
.cell.other{opacity:.35}
.cell.sel{background:var(--acc-soft);border-radius:8px}
.cell.today .d{color:var(--acc);text-decoration:underline}
.cell .o{color:var(--ink)}.cell .i{color:var(--blue)}
.cell .w{align-self:flex-end;background:var(--card-soft);color:var(--card);border-radius:4px;padding:0 3px;font-size:.6rem;font-weight:700}
/* rows */
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px;gap:8px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 16px;border:0;border-top:1px solid var(--rule);background:none;text-align:left;width:100%}
.row .dot{width:10px;height:10px;border-radius:50%}
.row .m{display:flex;flex-direction:column;min-width:0}
.row .m b{font-weight:500;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m small{font-size:.74rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .a{font-weight:700;text-align:right}
.row.virtual{opacity:.62}
.row.virtual .a::before{content:"予定 ";font-size:.66rem;color:var(--muted);font-weight:500;font-family:var(--f-body)}
.tag{display:inline-block;border-radius:5px;padding:0 5px;font-size:.68rem;margin-right:4px;background:var(--acc-soft);color:var(--acc)}
.tag.card{background:var(--card-soft);color:var(--card)}
.tag.cash{background:var(--c3);color:#fff}
.tag.emoney{background:var(--blue-soft);color:var(--blue)}
.tag.savings{background:var(--sav-soft);color:var(--sav)}
.dayh{padding:8px 16px 2px;font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;border-top:1px solid var(--rule)}
.empty{padding:18px 16px;color:var(--muted);font-size:.86rem;text-align:center}
.filters{display:flex;gap:6px;overflow-x:auto;padding:0 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button,.chips button{flex:0 0 auto;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 13px;font-size:.84rem}
.filters button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
/* budget */
.bar{height:8px;background:var(--paper);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar i.warn{background:var(--c3)}.bar i.over{background:var(--red)}
.brow{padding:12px 16px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.brow .h{display:flex;justify-content:space-between;gap:8px}
.brow .h b i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.brow .meta{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted)}
.big{font-size:1.6rem;font-weight:700}
/* stats */
.donut{display:flex;gap:16px;align-items:center;padding:16px;flex-wrap:wrap;justify-content:center}
.lg{display:grid;grid-template-columns:10px 1fr auto 3em;gap:8px;align-items:center;font-size:.86rem;padding:3px 0}
.lg i{width:10px;height:10px;border-radius:50%}
.lg .pct{color:var(--muted);text-align:right;font-size:.78rem}
/* accounts */
.acct{padding:16px;display:flex;flex-direction:column;gap:10px}
.acct .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.upl{list-style:none;margin:0;padding:0;font-size:.82rem}
.upl li{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;padding:5px 0;border-top:1px dashed var(--rule);align-items:baseline}
.upl li span:nth-child(2){color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upl li .after{font-size:.74rem;color:var(--muted);min-width:5.5em;text-align:right}
.upl li .after.minus{color:var(--red);font-weight:700}
/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.flabel{font-size:.72rem;letter-spacing:.1em;color:var(--muted);font-weight:500}
input[type=text],input[type=date],input[type=month],select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:0 12px;width:100%;min-width:0;height:44px;display:block}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;line-height:44px}
select{-webkit-appearance:none;appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 19px,calc(100% - 11px) 19px;background-size:5px 5px;background-repeat:no-repeat}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.three{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;background:var(--acc);color:#fff;flex:1}
.btn.sm{flex:0 0 auto;padding:9px 14px}
.btn.ghost{flex:0 0 auto;background:none;border:1px solid var(--rule);color:var(--muted)}
.btn.line{flex:0 0 auto;background:none;border:1px solid var(--acc);color:var(--acc)}
.btn.danger{flex:0 0 auto;background:none;border:1px solid var(--red);color:var(--red)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.actions{display:flex;gap:8px}
.err{color:var(--red);font-size:.82rem;min-height:1.2em}
.hint{font-size:.82rem;background:var(--acc-soft);border-radius:8px;padding:8px 11px}
.hint.c{background:var(--card-soft)}
.tip{font-size:.82rem;background:var(--blue-soft);border-radius:10px;padding:10px 12px;line-height:1.6}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--paper);border-radius:10px;padding:4px}
.seg button{border:0;background:none;border-radius:8px;padding:8px 4px;font-weight:700;color:var(--muted);white-space:nowrap;font-size:clamp(.78rem,3.6vw,.95rem)}
.seg button[aria-pressed=true]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.o[aria-pressed=true]{color:var(--red)}.seg button.i[aria-pressed=true]{color:var(--blue)}.seg button.m[aria-pressed=true]{color:var(--sav)}
.amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--rule);padding:2px 4px}
.amount span{font-size:1.4rem;color:var(--muted)}
.amount input{border:0;background:none;font-family:var(--f-num);font-size:2rem;font-weight:700;width:100%;color:var(--ink);padding:0;height:auto}
.amount input:focus{outline:none}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border:0;border-top:1px solid var(--rule);background:none;width:100%;text-align:left}
.item .m{display:flex;flex-direction:column;min-width:0}
.item small{color:var(--muted);font-size:.76rem}
.item .go{color:var(--acc);font-size:.8rem;flex:0 0 auto}
.catrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:6px;padding:10px 16px;border-top:1px solid var(--rule);align-items:center}
.catrow .mv,.irow .mv{width:36px;height:44px;border:1px solid var(--rule);background:none;border-radius:8px;color:var(--muted);padding:0}
.catrow .col{width:44px;padding:0 0 0 8px;background-image:none;text-align:center}
.irow{display:flex;align-items:stretch;border-top:1px solid var(--rule)}
.irow .item{border-top:0;flex:1}
.irow .mvs{display:flex;gap:4px;padding:8px 12px 8px 0;align-items:center}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.92rem}
.toggle input{width:22px;height:22px;accent-color:var(--acc)}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}.sw button[aria-pressed=true]{border-color:var(--ink)}
.sw.bg button{box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw .pick{position:relative;overflow:hidden;background:conic-gradient(#f66,#fc6,#6c6,#6cf,#96f,#f6c,#f66)}
.sw .pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;cursor:pointer}
.catrow .subs{grid-column:1/-1}
.catrow.in{grid-template-columns:minmax(0,1fr) auto auto auto}
.catrow .rm{border:1px solid var(--rule);background:none;border-radius:8px;padding:0 10px;height:44px;color:var(--red);font-size:.8rem}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--sheet);border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet form{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:13px}
.grip{width:40px;height:5px;border-radius:9px;background:var(--rule);margin:0 auto 4px}
/* setup */
.setup{position:fixed;inset:0;z-index:50;background:var(--paper);overflow:auto;padding:max(22px,env(safe-area-inset-top,0px)) 16px 40px}
.setup .inner{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.setup h1{font-size:1.45rem;margin-top:6px}
.setup p{margin:0;color:var(--muted);font-size:.9rem}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--rule)}
.steps i.on{background:var(--acc)}
.srow{border-top:1px solid var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.srow:first-child{border-top:0;padding-top:0}
.srow .hd{display:flex;justify-content:space-between;align-items:center}
.srow .rm{border:0;background:none;color:var(--red);font-size:.8rem}
/* tabs */
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(82px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:1.9rem;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:20}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);z-index:19;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs>div{max-width:620px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tabs button{border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;color:var(--muted)}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current=page]{color:var(--acc);font-weight:700}
.toast button{margin-left:12px;border:0;background:none;color:var(--acc-soft);font-weight:700;text-decoration:underline;padding:0}
.brow .h .r{display:flex;align-items:center;gap:10px}
.xdel{border:1px solid var(--rule);background:none;border-radius:999px;color:var(--muted);font-size:.72rem;padding:2px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:9px 16px;border-radius:999px;font-size:.85rem;z-index:60;max-width:calc(100% - 32px);text-align:center}
.foot{font-size:.74rem;color:var(--muted);text-align:center;margin:4px 0 0}
@media (max-width:370px){.cell{min-height:56px;font-size:.6rem}.three{grid-template-columns:1fr 1fr}.three>:first-child{grid-column:1/-1}}
button,a,.cell{touch-action:manipulation}
.banner{max-width:620px;margin:0 auto 12px;display:flex;gap:10px;align-items:flex-start;background:var(--acc-soft);border-radius:12px;padding:10px 12px;font-size:.84rem;line-height:1.55}
.banner .x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:1.1rem;line-height:1;padding:2px 4px}
.banner .b{flex:0 0 auto;border:0;background:var(--acc);color:#fff;border-radius:8px;padding:6px 10px;font-weight:700;font-size:.8rem}
.about{display:flex;justify-content:space-between;gap:8px;font-size:.84rem}
/* タブレット（縦） */
@media (min-width:640px){

  #app>.top{grid-area:top}#strip{grid-area:side;position:sticky;top:14px}#monthbar{grid-area:mbar}#view{grid-area:view;max-width:none;margin:0;width:100%}
  #strip .total{flex-wrap:wrap}#strip .total .big{font-size:1.5rem}#app>.foot{grid-area:foot}

  .sheet{max-height:96vh}
  body{padding-bottom:110px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<div class="warn" id="noStore" hidden style="max-width:620px;margin:0 auto 10px">この画面では記録を残しておけません（閉じると消えます）。iPhoneはSafari、AndroidはChromeでこのページを開き、「ホーム画面に追加」してから使ってください。</div>
<div class="banner" id="installBar" hidden></div>
<div class="banner" id="updateBar" hidden></div>
<div class="wrap" id="app">
  <header class="top">
    <div><div class="today" id="todayLbl"></div><h1 id="appName">家計簿</h1></div>
    <button class="setbtn" id="setBtn" type="button">設定</button>
  </header>
  <section class="card strip" id="strip"></section>
  <div class="monthbar" id="monthbar">
    <button class="nav" id="prev" aria-label="前の月">‹</button>
    <div class="t" id="mtitle"></div>
    <button class="nav" id="next" aria-label="次の月">›</button>
    <button class="todaybtn" id="thisMonth">今月</button>
  </div>
  <div id="view" class="wrap"></div>
  <p class="foot">記録はこの端末の中にだけ保存されます。設定 →「バックアップ」から、ときどき保存してください。</p>
</div>
<button class="fab" id="fab" aria-label="記録を追加">＋</button>
<nav class="tabs" aria-label="画面"><div>
  <button data-v="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>カレンダー</button>
  <button data-v="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>明細</button>
  <button data-v="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M15 15h3M7 6V4h10v2"/></svg>予算</button>
  <button data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v9l7.8 4.5"/><circle cx="12" cy="12" r="9"/></svg>統計</button>
  <button data-v="accts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10l9-6 9 6M5 10v8M19 10v8M9.5 10v8M14.5 10v8M3 21h18"/></svg>口座・カード</button>
</div></nav>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
/* ========== basics ========== */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d||1)};
const now=new Date(),todayStr=ymd(now),thisYm=todayStr.slice(0,7);
const WD=['日','月','火','水','木','金','土'];
let D=null;
const yen=n=>(n<0?'−¥':'¥')+Math.abs(Math.round(n)).toLocaleString('ja-JP');
const signed=n=>(n>0?'+':'')+yen(n);
const md=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'};
const mdj=s=>{const d=parse(s);return (d.getMonth()+1)+'月'+d.getDate()+'日('+WD[d.getDay()]+')'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const addMonths=(ym,n)=>{const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const ymj=ym=>Number(ym.slice(0,4))+'年'+Number(ym.slice(5))+'月';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const toHalf=s=>String(s||'').replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0)).replace(/[－ー−]/g,'-');
const money=v=>{const r=toHalf(v).replace(/[^\d-]/g,'');if(!r||r==='-')return null;const n=Number(r);return isNaN(n)?null:n};
const fmtMoney=n=>n==null||n===''?'':Number(n).toLocaleString('ja-JP');
function bindMoney(root){root.querySelectorAll('input[data-money]').forEach(inp=>inp.addEventListener('input',()=>{
  const neg=inp.dataset.money==='neg'&&/^[-－ー−]/.test(inp.value.trim());const r=toHalf(inp.value).replace(/[^\d]/g,'').slice(0,10);
  inp.value=(neg?'-':'')+(r?Number(r).toLocaleString('ja-JP'):'')}))}
const moneyInput=(id,val,neg,ph)=>'<input type="text" inputmode="'+(neg?'text':'numeric')+'" autocomplete="off" data-money="'+(neg?'neg':'1')+'" id="'+id+'" value="'+esc(fmtMoney(val))+'" placeholder="'+(ph||'0')+'">';

/* ========== Japanese bank holidays ========== */
const holCache={};
function holidays(y){
  if(holCache[y])return holCache[y];
  const s=new Set(),k=(m,d)=>pad(m)+'-'+pad(d),kd=d=>k(d.getMonth()+1,d.getDate());
  [[1,1],[2,11],[2,23],[4,29],[5,3],[5,4],[5,5],[8,11],[11,3],[11,23]].forEach(a=>s.add(k(a[0],a[1])));
  const nm=(m,n)=>{const dow=new Date(y,m-1,1).getDay();return 1+((1-dow+7)%7)+7*(n-1)};
  s.add(k(1,nm(1,2)));s.add(k(7,nm(7,3)));s.add(k(9,nm(9,3)));s.add(k(10,nm(10,2)));
  const q=Math.floor((y-1980)/4);
  s.add(k(3,Math.floor(20.8431+0.242194*(y-1980)-q)));s.add(k(9,Math.floor(23.2488+0.242194*(y-1980)-q)));
  [...s].forEach(x=>{const [m,d]=x.split('-').map(Number);const t=new Date(y,m-1,d+1),t2=new Date(y,m-1,d+2);
    if(t.getFullYear()===y&&t.getDay()!==0&&!s.has(kd(t))&&s.has(kd(t2)))s.add(kd(t))});
  [...s].sort().forEach(x=>{const [m,d]=x.split('-').map(Number);
    if(new Date(y,m-1,d).getDay()===0){let t=new Date(y,m-1,d+1);while(s.has(kd(t)))t.setDate(t.getDate()+1);s.add(kd(t))}});
  return holCache[y]=s;
}
const isHoliday=d=>holidays(d.getFullYear()).has(pad(d.getMonth()+1)+'-'+pad(d.getDate()));
function bankClosed(d){const w=d.getDay(),m=d.getMonth()+1,day=d.getDate();return w===0||w===6||isHoliday(d)||(m===12&&day===31)||(m===1&&day<=3)}

/* ========== data ========== */
const KEY='mainichi-kakeibo:v2';
const APP_VERSION='1.1.0';
const SUPPORT_URL='';// 販売ページやお問い合わせ先のURLを入れると、設定に「お問い合わせ」ボタンが出ます
const KINDS={bank:'銀行口座',cash:'財布（現金）',emoney:'電子マネー・アプリ',savings:'貯金用の口座'};
const KIND_SHORT={bank:'口座',cash:'現金',emoney:'電子マネー',savings:'貯金'};
const DEF_OUTSIDE={name:'予算外',subs:['特別な出費','税金','カードの支払い','立て替え','雑費']};
const OUT=()=>D.cats.outside.name;
const DEF_PREFS={theme:'auto',accent:'green',weekStart:0,monthStart:1,startTab:'last',tabs:{budget:true,stats:true},defType:'out',defSrc:'',defDst:'',horizon:62,warnBelow:0,totalSavings:true,cashWarn:false,bg:'default',bgColor:'#f4a6c0',bgStrength:1};
const DEF_OUT=[
  {name:'住居費',subs:['家賃','管理費','更新料'],budget:0},
  {name:'食費',subs:['食材','外食','カフェ・おやつ'],budget:0},
  {name:'光熱・通信費',subs:['電気代','ガス代','水道代','スマホ','ネット'],budget:0},
  {name:'日用品',subs:['消耗品','ドラッグストア','家具・家電'],budget:0},
  {name:'交通費',subs:['電車・バス','ガソリン','駐車場'],budget:0},
  {name:'趣味・娯楽',subs:['サブスク','本・ゲーム','旅行'],budget:0},
  {name:'その他',subs:['交際費','医療費','衣服・美容','保険','教育','雑費'],budget:0}];
const DEF_IN=['給与','賞与','副業','臨時収入','生活費の入金','利息・配当','返金','その他'];
const PALETTE=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)','var(--c8)'];
const IN_COLORS=['var(--blue)','var(--c2)','var(--c3)','var(--c4)','var(--c1)','var(--c6)','var(--c7)','var(--cx)'];
const clone=o=>JSON.parse(JSON.stringify(o));
function blank(){return {v:2,ready:false,name:'わが家の家計簿',accounts:[],cards:[],cats:{out:clone(DEF_OUT),in:DEF_IN.slice(),outside:clone(DEF_OUTSIDE)},entries:[],recurring:[],skips:[],last:{},prefs:clone(DEF_PREFS)}}
function normalize(){['accounts','cards','entries','recurring','skips'].forEach(k=>{if(!Array.isArray(D[k]))D[k]=[]});if(!D.last)D.last={};
  D.prefs=Object.assign(clone(DEF_PREFS),D.prefs||{});D.prefs.tabs=Object.assign({budget:true,stats:true},D.prefs.tabs||{});
  if(!D.cats)D.cats={};if(!Array.isArray(D.cats.out)||!D.cats.out.length)D.cats.out=clone(DEF_OUT);if(!Array.isArray(D.cats.in)||!D.cats.in.length)D.cats.in=DEF_IN.slice();if(!D.cats.outside)D.cats.outside=clone(DEF_OUTSIDE)}
try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!D||D.v!==2)D=blank();
normalize();
let C=null;
const canStore=(()=>{try{const k=KEY+':t';localStorage.setItem(k,'1');localStorage.removeItem(k);return true}catch(e){return false}})();
function persist(){C=null;if(!canStore)return;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('保存できませんでした。端末の空き容量を確認してください')}}
function commit(msg){persist();render();if(msg)toast(msg)}

const acc=id=>D.accounts.find(a=>a.id===id);
const cardOf=id=>D.cards.find(c=>c.id===id);
const liveAccs=()=>D.accounts.filter(a=>!a.archived);
const liveCards=()=>D.cards.filter(c=>!c.archived);
const nameOf=id=>{const a=acc(id);if(a)return a.name;const c=cardOf(id);return c?c.name:'（削除済み）'};
const outCats=()=>D.cats.out.map(c=>c.name).concat(OUT());
const subsOf=n=>n===OUT()?D.cats.outside.subs:((D.cats.out.find(c=>c.name===n)||{}).subs||[]);
function colorOf(cat,type){
  if(type==='in'){const i=D.cats.in.indexOf(cat);return i<0?'var(--cx)':IN_COLORS[i%IN_COLORS.length]}
  if(type==='move')return 'var(--sav)';
  const i=D.cats.out.findIndex(c=>c.name===cat);if(i<0)return 'var(--cx)';const c=D.cats.out[i];return PALETTE[(c.color!=null?c.color:i)%PALETTE.length];
}
function moveLabel(e){const d=acc(e.dst),s=acc(e.src);
  if(d&&d.kind==='savings')return '貯金';if(d&&d.kind==='emoney')return 'チャージ';
  if(d&&d.kind==='cash'&&s&&s.kind!=='cash')return '引き出し';if(s&&s.kind==='savings')return '貯金から移動';if(cardOf(e.src))return 'カードでチャージ';return '振替'}
const label=e=>e.type==='move'?moveLabel(e):(e.sub||e.cat);
const isSaving=e=>e.type==='move'&&acc(e.dst)&&acc(e.dst).kind==='savings';
const dayText=d=>d>=29?'月末':d+'日';
const closeText=c=>c?c+'日締め':'月末締め';
const payText=c=>closeText(c.close)+'・'+(c.lag===2?'翌々月':'翌月')+dayText(c.day)+'払い';

// カード：close 日締め（0 は月末締め）・翌月 day 日払い（29 以上は月末）。休業日は次の営業日。k 回目の分割は k か月あと。
function wdDate(c,dateStr,k){
  const [y,m,d]=dateStr.split('-').map(Number);
  const mi=m-1+(c.close&&d>c.close?1:0)+(c.lag||1)+(k||0);
  const dim=new Date(y,mi+1,0).getDate();
  const t=new Date(y,mi,Math.min(c.day>=29?31:c.day||27,dim));
  if(c.adj==='prev'){while(bankClosed(t))t.setDate(t.getDate()-1)}else{while(bankClosed(t))t.setDate(t.getDate()+1)}
  return ymd(t);
}
function recDate(r,ym){
  const [y,m]=ym.split('-').map(Number),dim=new Date(y,m,0).getDate();
  const d=new Date(y,m-1,Math.min(r.day>=29?31:r.day||1,dim));
  if(r.adj==='prev'){while(bankClosed(d))d.setDate(d.getDate()-1)}else if(r.adj!=='none'){while(bankClosed(d))d.setDate(d.getDate()+1)}
  return ymd(d);
}
function recFirstYm(r){return recDate(r,thisYm)>=todayStr?thisYm:addMonths(thisYm,1)}

/* 記録（毎月の予定を含む）と、口座ごとのお金の動き */
function calc(){
  if(C)return C;
  const taken=new Set(D.entries.filter(e=>e.rec).map(e=>e.rec)),skip=new Set(D.skips),last=addMonths(thisYm,12),virt=[];
  D.recurring.forEach(r=>{let ym=r.start||thisYm,g=0;const end=r.end&&r.end<last?r.end:last;
    while(ym<=end&&g++<400){const key=r.id+':'+ym;
      if(!taken.has(key)&&!skip.has(key))virt.push({id:'v:'+key,rec:key,virtual:true,type:r.type,amount:r.amount,cat:r.cat,sub:r.sub||'',memo:r.memo||'',src:r.src,dst:r.dst,date:recDate(r,ym),ts:0});
      ym=addMonths(ym,1)}});
  const all=D.entries.concat(virt),flows=[];
  const viaCard=(e,c)=>{const n=Math.max(1,e.inst||1),base=Math.floor(e.amount/n),first=e.amount-base*(n-1);
    for(let k=0;k<n;k++)flows.push({date:wdDate(c,e.date,k),acct:c.acct,amt:-(k?base:first),e,card:c.id,k,n})};
  all.forEach(e=>{
    if(e.type==='out'){const c=cardOf(e.src);if(c)viaCard(e,c);else flows.push({date:e.date,acct:e.src,amt:-e.amount,e})}
    else if(e.type==='in'){const c=cardOf(e.dst);if(c)flows.push({date:wdDate(c,e.date,0),acct:c.acct,amt:e.amount,e,card:c.id,k:0,n:1});else flows.push({date:e.date,acct:e.dst,amt:e.amount,e})}
    else{const c=cardOf(e.src);if(c)viaCard(e,c);else flows.push({date:e.date,acct:e.src,amt:-e.amount,e});flows.push({date:e.date,acct:e.dst,amt:e.amount,e})}
  });
  flows.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  return C={all,flows};
}
// 残高を合わせた日より後の動き（同じ日なら合わせたあとに記録したもの）だけを足す
const counted=(f,b)=>f.date>b.date||(f.date===b.date&&(f.e.ts||0)>(b.setAt||0));
function balAt(a,date){if(!a.bal)return null;let v=a.bal.amount;calc().flows.forEach(f=>{if(f.acct===a.id&&f.date<=date&&counted(f,a.bal))v+=f.amt});return v}
function upcoming(a,days){
  const lim=ymd(new Date(now.getFullYear(),now.getMonth(),now.getDate()+days));
  let run=balAt(a,todayStr);const out=[];
  calc().flows.forEach(f=>{if(f.acct!==a.id||f.date<=todayStr||f.date>lim)return;
    if(a.bal&&!counted(f,a.bal))return;
    const g=out.length&&out[out.length-1].date===f.date?out[out.length-1]:(out.push({date:f.date,items:[],net:0}),out[out.length-1]);
    g.items.push(f);g.net+=f.amt;});
  out.forEach(g=>{if(run!==null){run+=g.net;g.after=run}});
  return out;
}
function cardWithdrawals(c){
  const m={};calc().flows.forEach(f=>{if(f.card!==c.id||f.date<=todayStr)return;(m[f.date]||(m[f.date]={date:f.date,total:0,items:[]})).total-=f.amt;m[f.date].items.push(f)});
  return Object.values(m).sort((a,b)=>a.date<b.date?-1:1);
}
// 集計の「月」：月の始まり日が 25 なら「11月」は 10/25〜11/24
function period(ym){const s=D.prefs.monthStart||1;if(s===1){const [y,m]=ym.split('-').map(Number);return [ym+'-01',ym+'-'+pad(new Date(y,m,0).getDate())]}
  const e=parse(ym+'-'+pad(s));e.setDate(e.getDate()-1);return [addMonths(ym,-1)+'-'+pad(s),ymd(e)]}
function periodYm(ds){const s=D.prefs.monthStart||1,ym=ds.slice(0,7);return s>1&&Number(ds.slice(8))>=s?addMonths(ym,1):ym}
const curYm=()=>periodYm(todayStr);
function monthOf(ym){const [a,b]=period(ym);return calc().all.filter(e=>e.date>=a&&e.date<=b)}

/* ========== state ========== */
const state={view:'cal',ym:curYm(),sel:todayStr,filter:'all',statType:'out',statBy:'cat',budEdit:false,balEdit:null};
try{const st=D.prefs.startTab;const v=st==='last'?localStorage.getItem(KEY+':view'):st;if(['cal','list','budget','stats','accts'].includes(v))state.view=v}catch(e){}
if(['budget','stats'].includes(state.view)&&!D.prefs.tabs[state.view])state.view='cal';
const saveView=()=>{try{localStorage.setItem(KEY+':view',state.view)}catch(e){}};

/* ========== render ========== */
// 背景の色：[ライト, ダーク]
const BG={default:['#f2f5f4','#12191c','おまかせ'],white:['#ffffff','#0f1214','ホワイト'],cream:['#f7f2e8','#1b1914','クリーム'],pink:['#fbeef3','#1f151a','ピンク'],
  blue:['#ecf2fa','#121821','ブルー'],lavender:['#f1eefa','#18151f','ラベンダー'],mint:['#e7f5ee','#111d17','ミント'],gray:['#e9ebec','#161718','グレー']};
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgbHex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mixHex=(a,b,t)=>{const x=hexRgb(a),y=hexRgb(b);return rgbHex(x.map((v,i)=>v+(y[i]-v)*t))};
const lum=h=>{const c=hexRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const darkNow=()=>{const t=D.prefs.theme;return t==='dark'||(t==='auto'&&!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))};
// 自由に選んだ色は、文字が読みやすい明るさに整えて使う
function customBg(c,strength){let t=[.85,.7,.5][strength]!=null?[.85,.7,.5][strength]:.7,l=mixHex(c,'#ffffff',t);while(lum(l)<.55&&t<.97){t+=.05;l=mixHex(c,'#ffffff',t)}return [l,mixHex(c,'#101418',.84)]}
function paperColor(){const p=D.prefs;let pair=BG[p.bg]||null;if(p.bg==='custom'&&/^#[0-9a-f]{6}$/i.test(p.bgColor||''))pair=customBg(p.bgColor,p.bgStrength);return pair?(darkNow()?pair[1]:pair[0]):null}
try{window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyLook())}catch(e){}
function applyLook(){const r=document.documentElement,p=D.prefs;
  if(!p.bg||p.bg==='default')r.style.removeProperty('--paper');else{const c=paperColor();if(c)r.style.setProperty('--paper',c)}
  if(p.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',p.theme);
  if(p.accent==='green')r.removeAttribute('data-acc');else r.setAttribute('data-acc',p.accent);
  document.querySelectorAll('.tabs button').forEach(b=>{const k=b.dataset.v;b.hidden=(k==='budget'||k==='stats')&&!p.tabs[k]});
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(r).getPropertyValue('--acc').trim()||'#2e7a5a';}
function render(){
  applyLook();
  if(['budget','stats'].includes(state.view)&&!D.prefs.tabs[state.view])state.view='cal';
  $('appName').textContent=D.name||'家計簿';
  $('todayLbl').textContent='今日 '+mdj(todayStr);
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===state.view?'page':'false'));
  const isSet=state.view==='set';
  $('strip').hidden=isSet||state.view==='accts';
  $('app').classList.toggle('full',$('strip').hidden);
  $('fab').hidden=isSet;
  if(!$('strip').hidden)renderStrip();
  const showM=['cal','list','budget','stats'].includes(state.view);
  $('monthbar').hidden=!showM;
  if(showM){const [y,m]=state.ym.split('-').map(Number),pr=period(state.ym);$('mtitle').innerHTML='<small>'+y+'年</small>'+m+'月'+(D.prefs.monthStart>1?'<small style="display:block;margin:0">'+md(pr[0])+'〜'+md(pr[1])+'</small>':'');$('thisMonth').hidden=state.ym===curYm()}
  const v=$('view');v.innerHTML='';
  ({cal:renderCal,list:renderList,budget:renderBudget,stats:renderStats,accts:renderAccts,set:renderSettings})[state.view](v);
}
const el=(tag,cls,html)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(html!=null)x.innerHTML=html;return x};

function renderStrip(){
  const s=$('strip'),accs=liveAccs();
  if(!accs.length){s.innerHTML='<div class="note">口座や財布がまだありません。</div><button class="link" id="goSet1">設定で追加する</button>';$('goSet1').onclick=()=>go('set');return}
  let tot=0,unset=0;const chips=accs.map(a=>{const b=balAt(a,todayStr);if(b===null)unset++;else if(D.prefs.totalSavings||a.kind!=='savings')tot+=b;
    return '<button class="chip" data-a="'+a.id+'"><small>'+esc(a.name)+'</small><b class="num'+(b<0?' minus':'')+'">'+(b===null?'未設定':yen(b))+'</b></button>'}).join('');
  let h='<div class="total"><span class="label">今日のお金の合計'+(D.prefs.totalSavings?'':'（貯金をのぞく）')+(unset?'（未設定'+unset+'件をのぞく）':'')+'</span><span class="big num'+(tot<0?' minus':'')+'">'+yen(tot)+'</span></div><div class="accs">'+chips+'</div>';
  // 次のカード引き落とし（口座ごと）
  const groups={};liveCards().forEach(c=>cardWithdrawals(c).forEach(w=>{const k=w.date+'|'+c.acct;(groups[k]||(groups[k]={date:w.date,acct:c.acct,lines:[]})).lines.push([c.name,w.total])}));
  const next=Object.values(groups).sort((a,b)=>a.date<b.date?-1:1)[0];
  if(next){const a=acc(next.acct),tot2=next.lines.reduce((x,l)=>x+l[1],0);const after=a?balAt(a,next.date):null;
    h+='<div class="nextbox"><div class="h"><span>次のカード引き落とし <b>'+mdj(next.date)+'</b></span><b class="num">'+yen(tot2)+'</b></div>'+
      (next.lines.length>1?'<ul>'+next.lines.map(l=>'<li><span>・'+esc(l[0])+'</span><span class="num">'+yen(l[1])+'</span></li>').join('')+'</ul>':'')+
      '<div class="note">'+(next.lines.length===1?esc(next.lines[0][0])+' ・ ':'')+esc(a?a.name:'（口座なし）')+'から'+(after===null?'':after<0?' ・ <b class="minus">'+yen(-after)+' 足りません</b>':' ・ 引き落とし後 <b class="num">'+yen(after)+'</b>')+'</div></div>';
  }
  // 2か月以内に残高がマイナスになる口座
  const wb=D.prefs.warnBelow||0,warns=[];accs.forEach(a=>{if(!a.bal||(a.kind==='cash'&&!D.prefs.cashWarn))return;const u=upcoming(a,D.prefs.horizon||62).find(g=>g.after<wb);if(u)warns.push(u.after<0?mdj(u.date)+'に「'+a.name+'」が '+yen(-u.after)+' 足りなくなります':mdj(u.date)+'に「'+a.name+'」の残高が '+yen(u.after)+' になります（'+yen(wb)+'を下回ります）')});
  if(warns.length)h+=warns.map(w=>'<div class="warn">⚠ '+esc(w)+'</div>').join('');
  const lb=D.lastBackup,since=lb?Math.round((parse(todayStr)-parse(lb))/864e5):null;
  if(D.entries.length>=10&&(since===null||since>=30))h+='<div class="tip" style="display:flex;gap:10px;align-items:center;justify-content:space-between"><span>'+(lb?'最後のバックアップから'+since+'日たちました。':'まだバックアップがありません。')+'</span><button class="btn sm" type="button" id="stripBk">保存する</button></div>';
  s.innerHTML=h;
  s.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{state.filter=b.dataset.a;go('list')});
  if($('stripBk'))$('stripBk').onclick=exportBackup;
}

function sumMonth(list){let i=0,o=0,s=0;list.forEach(e=>{if(e.type==='in'&&!cardOf(e.dst))i+=e.amount;else if(e.type==='out')o+=e.amount;else if(isSaving(e))s+=e.amount});return {i,o,s}}
function sum3(list){const t=sumMonth(list);return el('section','card sum3','<div><span class="label">収入</span><span class="v num plus">'+yen(t.i)+'</span></div><div><span class="label">支出</span><span class="v num">'+yen(t.o)+'</span></div><div><span class="label">収支</span><span class="v num '+(t.i-t.o<0?'minus':'plus')+'">'+signed(t.i-t.o)+'</span></div>')}

function srcTag(e){
  if(e.type==='in'){const c=cardOf(e.dst);if(c)return '<span class="tag card">'+esc(c.name)+'に返金</span>';const a=acc(e.dst);return '<span class="tag '+(a?a.kind:'')+'">'+esc(nameOf(e.dst))+'へ</span>'}
  if(e.type==='move')return '<span class="tag savings">'+esc(nameOf(e.src))+' → '+esc(nameOf(e.dst))+'</span>';
  const c=cardOf(e.src);if(c){const n=e.inst>1?e.inst+'回払い・':'';return '<span class="tag card">'+esc(c.name)+'</span>'+n+md(wdDate(c,e.date,0))+'引き落とし'}
  const a=acc(e.src);return '<span class="tag '+(a?a.kind:'')+'">'+esc(nameOf(e.src))+'</span>';
}
function entryRow(e,showDate){
  const b=el('button','row'+(e.virtual?' virtual':''));b.type='button';
  const amt=e.type==='in'?'<span class="num plus">+'+yen(e.amount)+'</span>':e.type==='move'?'<span class="num" style="color:var(--sav)">'+yen(e.amount)+'</span>':'<span class="num">'+yen(e.amount)+'</span>';
  b.innerHTML='<i class="dot" style="background:'+colorOf(e.cat,e.type)+'"></i><span class="m"><b>'+esc(label(e))+(e.memo?' ・ '+esc(e.memo):'')+'</b><small>'+(showDate?md(e.date)+' ・ ':'')+srcTag(e)+'</small></span><span class="a">'+amt+'</span>';
  b.onclick=()=>openEntry(e);return b;
}

// カレンダーのダブルタップ判定（描き直しても消えないようにここで覚える）
const TAP={ds:'',t:0};
function renderCal(v){
  const ym=state.ym,list=monthOf(ym);v.append(sum3(list));
  const ws=D.prefs.weekStart||0,[pa,pb]=period(ym),first=parse(pa),start=new Date(first);start.setDate(first.getDate()-((first.getDay()-ws+7)%7));
  const byDay={};list.forEach(e=>{const d=byDay[e.date]||(byDay[e.date]={o:0,i:0});if(e.type==='out')d.o+=e.amount;else if(e.type==='in'&&!cardOf(e.dst))d.i+=e.amount});
  const wd={};calc().flows.forEach(f=>{if(f.card&&f.amt<0)wd[f.date]=(wd[f.date]||0)-f.amt});
  const c=el('section','card cal');
  c.innerHTML=[0,1,2,3,4,5,6].map(i=>{const k=(i+ws)%7;return '<div class="wd'+(k===0?' sun':k===6?' sat':'')+'">'+WD[k]+'</div>'}).join('');
  const days=Math.round((parse(pb)-first)/864e5)+1,weeks=Math.ceil(((first.getDay()-ws+7)%7+days)/7);
  for(let i=0;i<weeks*7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=ymd(d),x=byDay[ds];
    const b=el('button','cell'+(ds<pa||ds>pb?' other':'')+(ds===state.sel?' sel':'')+(ds===todayStr?' today':'')+(d.getDay()===0||isHoliday(d)?' sun':d.getDay()===6?' sat':''));
    b.type='button';b.innerHTML='<span class="d">'+d.getDate()+'</span>'+(x&&x.o?'<span class="o num">'+x.o.toLocaleString()+'</span>':'')+(x&&x.i?'<span class="i num">+'+x.i.toLocaleString()+'</span>':'')+(wd[ds]?'<span class="w">引落</span>':'');
    b.onclick=()=>{const t=Date.now();if(TAP.ds===ds&&t-TAP.t<450){TAP.t=0;openEntry(null,ds);return}TAP.ds=ds;TAP.t=t;state.sel=ds;if(periodYm(ds)!==state.ym)state.ym=periodYm(ds);render()};
    c.append(b)}
  v.append(c);
  const dc=el('section','card');const items=calc().all.filter(e=>e.date===state.sel).sort((a,b)=>(b.ts||0)-(a.ts||0));
  dc.append(el('div','sec-h','<h2>'+mdj(state.sel)+'</h2><button class="link" type="button" id="addDay">＋ この日に記録</button>'));
  const rows=el('div','rows');items.forEach(e=>rows.append(entryRow(e)));
  const wds={};calc().flows.forEach(f=>{if(f.card&&f.date===state.sel){const k=f.card;(wds[k]||(wds[k]={c:cardOf(f.card),t:0})).t-=f.amt}});
  Object.values(wds).forEach(w=>{if(!w.c)return;rows.append(el('div','row','<i class="dot" style="background:var(--card)"></i><span class="m"><b>'+esc(w.c.name)+'の引き落とし</b><small>'+esc(nameOf(w.c.acct))+'から</small></span><span class="a num'+(w.t>0?' minus':' plus')+'">'+(w.t>0?'−':'+')+yen(Math.abs(w.t)).replace('−','')+'</span>'))});
  if(!rows.children.length)rows.append(el('div','empty','この日の記録はありません。日付を2回タップしても記録できます。'));
  dc.append(rows);v.append(dc);$('addDay').onclick=()=>openEntry(null,state.sel);
}

function renderList(v){
  const ym=state.ym;let list=monthOf(ym);
  const f=el('div','filters');const opts=[['all','すべて']].concat(liveAccs().map(a=>[a.id,a.name]),liveCards().map(c=>[c.id,c.name]));
  if(!opts.some(o=>o[0]===state.filter))state.filter='all';
  opts.forEach(([id,n])=>{const b=el('button','',esc(n));b.type='button';b.setAttribute('aria-pressed',state.filter===id);b.onclick=()=>{state.filter=id;render()};f.append(b)});
  v.append(f);
  if(state.filter!=='all')list=list.filter(e=>e.src===state.filter||e.dst===state.filter);
  v.append(sum3(list));
  const c=el('section','card');
  if(!list.length)c.append(el('div','empty','この月の記録はありません。右下の＋から記録できます。'));
  const days={};list.forEach(e=>(days[e.date]||(days[e.date]=[])).push(e));
  Object.keys(days).sort().reverse().forEach(d=>{const t=sumMonth(days[d]);c.append(el('div','dayh','<span>'+mdj(d)+'</span><span class="num">'+(t.o?yen(-t.o):'')+(t.i?' +'+yen(t.i):'')+'</span>'));
    days[d].sort((a,b)=>(b.ts||0)-(a.ts||0)).forEach(e=>c.append(entryRow(e)))});
  v.append(c);
}

function budgetUse(ym){
  const used={};D.cats.out.forEach(c=>used[c.name]=0);let outside=0;
  monthOf(ym).forEach(e=>{if(e.type!=='out')return;if(Object.prototype.hasOwnProperty.call(used,e.cat))used[e.cat]+=e.amount;else outside+=e.amount});
  const tb=D.cats.out.reduce((s,c)=>s+(Number(c.budget)||0),0),tu=D.cats.out.filter(c=>c.budget>0).reduce((s,c)=>s+used[c.name],0);
  return {used,outside,tb,tu,rest:tb-tu};
}
const bar=(u,b)=>{const p=b>0?Math.min(100,u/b*100):(u>0?100:0);return '<div class="bar"><i class="'+(u>b?'over':p>=85?'warn':'')+'" style="width:'+p.toFixed(1)+'%"></i></div>'};
function renderBudget(v){
  const ym=state.ym,u=budgetUse(ym);
  const top=el('section','card pad');
  if(!u.tb)top.innerHTML='<h2>予算</h2><div class="note">まだ予算がありません。「予算を変更」から費目ごとの月の予算を入れると、残りと使いすぎがわかります。予算を入れない費目は、予算の計算に入りません。</div>';
  else{let note='';if(ym===curYm()&&u.rest>0){const left=Math.round((parse(period(ym)[1])-parse(todayStr))/864e5)+1;note='<div class="note">あと'+left+'日 ・ 1日あたり <b class="num">'+yen(Math.floor(u.rest/left))+'</b> 使えます</div>'}
    top.innerHTML='<div class="total"><div><div class="label">'+Number(ym.slice(5))+'月の予算 '+(u.rest<0?'超過':'残り')+'</div><div class="big num'+(u.rest<0?' minus':'')+'">'+yen(Math.abs(u.rest))+'</div></div><div class="note" style="text-align:right">予算 <span class="num">'+yen(u.tb)+'</span><br>使った <span class="num">'+yen(u.tu)+'</span></div></div>'+bar(u.tu,u.tb)+note}
  v.append(top);
  const c=el('section','card');c.append(el('div','sec-h','<h2>費目ごと</h2><button class="link" id="budEd" type="button">'+(state.budEdit?'閉じる':'予算を変更')+'</button>'));
  if(state.budEdit){const f=el('div','pad');f.innerHTML='<div class="two">'+D.cats.out.map((x,i)=>'<div class="field"><label for="bd'+i+'">'+esc(x.name)+'</label>'+moneyInput('bd'+i,x.budget||'')+'</div>').join('')+'</div>'+
      '<div class="field"><label for="bdNew">費目を追加</label><div class="btnrow" style="flex-wrap:nowrap"><input type="text" id="bdNew" maxlength="12" placeholder="例：ペット"><button class="btn line" type="button" id="bdAdd">追加</button></div></div>'+
      '<div class="note">毎月同じ予算として使います。空欄は予算なしです。内訳や色・並び順は「設定」から変えられます。</div><div><button class="btn sm" id="budSave" type="button">保存</button></div>';
    c.append(f);bindMoney(f)}
  D.cats.out.forEach(x=>{const b=Number(x.budget)||0,us=u.used[x.name],r=b-us;
    c.append(el('div','brow','<div class="h"><b><i style="background:'+colorOf(x.name,'out')+'"></i>'+esc(x.name)+'</b><span class="r">'+(b?'<span class="'+(r<0?'minus':'')+'">'+(r>=0?'残り <span class="num">'+yen(r)+'</span>':'<span class="num">'+yen(-r)+'</span> 超過')+'</span>':'<span class="note">予算なし</span>')+'<button type="button" class="xdel" data-del="'+esc(x.name)+'" aria-label="'+esc(x.name)+'を消す">削除</button></span></div>'+(b?bar(us,b):'')+'<div class="meta"><span>使った <span class="num">'+yen(us)+'</span></span>'+(b?'<span>予算 <span class="num">'+yen(b)+'</span></span>':'')+'</div>'))});
  c.append(el('div','brow','<div class="h"><b><i style="background:var(--cx)"></i>'+esc(OUT())+'</b><span class="num">'+yen(u.outside)+'</span></div><div class="note">予算に数えない出費（税金・特別な出費など）</div>'));
  v.append(c);
  $('budEd').onclick=()=>{state.budEdit=!state.budEdit;render()};
  const keepBud=()=>{if($('budSave'))D.cats.out.forEach((x,i)=>{const n=$('bd'+i);if(n)x.budget=money(n.value)||0})};
  c.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{keepBud();deleteCat(b.dataset.del)});
  if($('bdAdd')){const add=()=>{keepBud();if(addCat($('bdNew').value)){commit('費目を追加しました');const l=D.cats.out.length-1,i=$('bd'+l);if(i)i.focus()}};$('bdAdd').onclick=add;$('bdNew').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}}}
  if($('budSave'))$('budSave').onclick=()=>{D.cats.out.forEach((x,i)=>x.budget=money($('bd'+i).value)||0);state.budEdit=false;commit('予算を保存しました')};
}

function renderStats(v){
  const t=state.statType,list=monthOf(state.ym).filter(e=>e.type===t&&!(t==='in'&&cardOf(e.dst)));
  const tg=el('div','filters');[['out','支出'],['in','収入']].forEach(([k,n])=>{const b=el('button','',n);b.setAttribute('aria-pressed',t===k);b.onclick=()=>{state.statType=k;render()};tg.append(b)});
  if(t==='out')[['cat','費目別'],['src','支払い元別']].forEach(([k,n])=>{const b=el('button','',n);b.setAttribute('aria-pressed',state.statBy===k);b.onclick=()=>{state.statBy=k;render()};tg.append(b)});
  v.append(tg);
  const by=t==='out'&&state.statBy==='src';const sums={};list.forEach(e=>{const k=by?nameOf(e.src):e.cat;sums[k]=(sums[k]||0)+e.amount});
  const total=Object.values(sums).reduce((a,b)=>a+b,0),c=el('section','card');
  if(!total){c.append(el('div','empty','この月の'+(t==='out'?'支出':'収入')+'はありません。'));v.append(c);return}
  const keys=Object.keys(sums).sort((a,b)=>sums[b]-sums[a]);
  const col=(k,i)=>by?PALETTE[i%PALETTE.length]:colorOf(k,t);
  const R=54,Cc=2*Math.PI*R;let off=0,svg='<svg viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="内訳">';
  keys.forEach((k,i)=>{const len=sums[k]/total*Cc;svg+='<circle cx="75" cy="75" r="'+R+'" fill="none" stroke="'+col(k,i)+'" stroke-width="22" stroke-dasharray="'+len.toFixed(2)+' '+(Cc-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 75 75)"/>';off+=len});
  svg+='<text x="75" y="72" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">合計</text><text x="75" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor" class="num">'+yen(total)+'</text></svg>';
  const lg=keys.map((k,i)=>'<div class="lg"><i style="background:'+col(k,i)+'"></i><span>'+esc(k)+'</span><span class="num">'+yen(sums[k])+'</span><span class="pct num">'+Math.round(sums[k]/total*100)+'%</span></div>').join('');
  c.innerHTML='<div class="donut">'+svg+'<div style="flex:1;min-width:200px">'+lg+'</div></div>';v.append(c);
  // 6か月の推移
  const tr=el('section','card pad');let mx=0;const ms=[];for(let i=5;i>=0;i--){const ym=addMonths(state.ym,-i);const s=sumMonth(monthOf(ym));const val=t==='out'?s.o:s.i;ms.push([ym,val]);mx=Math.max(mx,val)}
  tr.innerHTML='<h2>6か月の'+(t==='out'?'支出':'収入')+'</h2>'+ms.map(([ym,val])=>'<div style="display:grid;grid-template-columns:3em 1fr 6.5em;gap:8px;align-items:center;font-size:.82rem"><span class="note">'+Number(ym.slice(5))+'月</span><div class="bar"><i style="width:'+(mx?val/mx*100:0).toFixed(1)+'%;background:'+(t==='out'?'var(--acc)':'var(--blue)')+'"></i></div><span class="num" style="text-align:right">'+yen(val)+'</span></div>').join('');
  v.append(tr);
}

function renderAccts(v){
  const accs=liveAccs();
  v.append(el('div','sec-h','<h2>口座・財布・電子マネー</h2><button class="link" type="button" id="addA">＋ 追加</button>'));
  if(!accs.length)v.append(el('section','card empty','まだありません。「＋ 追加」から登録してください。'));
  accs.forEach(a=>{

function entryHint(){

function saveEntry(){
  readEntry();const v=ED.v,o=ED.orig,err=$('eErr');
  if(!v.amount||v.amount<=0){err.textContent='金額を入れてください';return}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v.date||'')){err.textContent='日付を選んでください';return}
  if(v.type!=='in'&&!(acc(v.src)||cardOf(v.src))){err.textContent='支払い元を選んでください';return}
  if(v.type!=='out'&&!(acc(v.dst)||cardOf(v.dst))){err.textContent='入れる先を選んでください';return}
  if(v.type==='move'&&v.src===v.dst){err.textContent='「どこから」と「どこへ」が同じです';return}
  const isPlan=!!(o&&o.virtual),e={id:o&&!isPlan?o.id:uid(),type:v.type,amount:v.amount,date:v.date,memo:v.memo||'',ts:o&&!isPlan?o.ts:Date.now()};
  if(o&&o.rec)e.rec=o.rec;
  if(v.type==='out'){e.cat=v.cat;if(v.sub)e.sub=v.sub;e.src=v.src;if(cardOf(v.src)&&v.inst>1)e.inst=v.inst}
  else if(v.type==='in'){e.cat=v.cat;e.dst=v.dst}
  else{e.src=v.src;e.dst=v.dst}
  if(o&&!isPlan)D.entries=D.entries.map(x=>x.id===o.id?e:x);else D.entries.push(e);

const catRow=(n,subs,col)=>'<div class="catrow" data-orig="'+esc(n)+'"><select class="col" aria-label="色" style="color:'+SWATCH[col||0]+'">'+SWATCH.map((c,i)=>'<option value="'+i+'" style="color:'+c+'"'+(i===col?' selected':'')+'>●</option>').join('')+'</select>'+

  '<input type="text" class="subs cs" maxlength="150" placeholder="内訳（なくてもOK）" value="'+esc((subs||[]).join('、'))+'"></div>';
const inRow=n=>'<div class="catrow in" data-orig="'+esc(n)+'"><input type="text" class="cn" maxlength="12" placeholder="収入の種類" value="'+esc(n)+'"><button type="button" class="mv" data-d="-1" aria-label="上へ">↑</button><button type="button" class="mv" data-d="1" aria-label="下へ">↓</button><button type="button" class="rm">削除</button></div>';
function saveCats(cl){
  const out=[],ren={},seen=new Set();
  for(const r of cl.querySelectorAll('.catrow')){const name=r.querySelector('.cn').value.trim();if(!name)continue;
    if(name===OUT()){toast('「'+OUT()+'」は別の名前にしてください');return}if(seen.has(name)){toast('「'+name+'」が2つあります');return}seen.add(name);
    const o=r.dataset.orig,old=D.cats.out.find(c=>c.name===o);
    out.push({name,subs:r.querySelector('.cs').value.split(/[、,，]/).map(x=>x.trim()).filter(Boolean),budget:old?old.budget||0:0,color:Number(r.querySelector('.col').value)||0});if(o&&o!==name)ren[o]=name}
  if(!out.length){toast('費目を1つ以上入れてください');return}
  const keep=new Set(out.map(c=>c.name)),fix=e=>{if(e.type!=='out')return;if(ren[e.cat])e.cat=ren[e.cat];else if(!keep.has(e.cat)&&e.cat!==OUT()){e.cat=OUT();e.sub=''}};
  D.entries.forEach(fix);D.recurring.forEach(fix);D.cats.out=out;commit('費目を保存しました');
}
function saveIn(il){
  const out=[],ren={},seen=new Set();
  for(const r of il.querySelectorAll('.catrow')){const name=r.querySelector('.cn').value.trim();if(!name)continue;if(seen.has(name)){toast('「'+name+'」が2つあります');return}seen.add(name);out.push(name);const o=r.dataset.orig;if(o&&o!==name)ren[o]=name}
  if(!out.length){toast('1つ以上入れてください');return}
  const keep=new Set(out),last=out[out.length-1],fix=e=>{if(e.type!=='in')return;if(ren[e.cat])e.cat=ren[e.cat];else if(!keep.has(e.cat))e.cat=last};
  D.entries.forEach(fix);D.recurring.forEach(fix);D.cats.in=out;commit('収入の種類を保存しました');
}
async function exportCsv(){
  const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
  const rows=[['日付','種類','費目','内訳','金額','支払い元・振替元','入金先・振替先','分割回数','カード引き落とし日','メモ']];
  D.entries.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).forEach(e=>{const c=e.type!=='in'&&cardOf(e.src);
    rows.push([e.date,e.type==='out'?'支出':e.type==='in'?'収入':'振替',e.type==='move'?moveLabel(e):e.cat,e.sub||'',e.amount,e.src?nameOf(e.src):'',e.dst?nameOf(e.dst):'',e.inst||'',c?wdDate(c,e.date,0):'',e.memo||''])});
  const blob=new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'});
  saveFile('kakeibo-'+todayStr+'.csv',blob,'text/csv').then(ok=>{if(ok)toast('CSVを書き出しました')});
}
// スマホ・タブレットは共有シート（「ファイルに保存」「Googleドライブ」など）、パソコンはダウンロード
const isTouch=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
async function saveFile(name,blob,type){
  try{const f=new File([blob],name,{type});
    if(isTouch&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return true}}
  catch(e){if(e&&e.name==='AbortError')return false}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true}
  catch(e){toast('この画面ではファイルを保存できません');return false}
}
async function exportBackup(){
  const blob=new Blob([JSON.stringify({app:'mainichi-kakeibo',version:2,exportedAt:new Date().toISOString(),data:D})],{type:'application/json'});
  if(await saveFile('kakeibo-backup-'+todayStr+'.json',blob,'application/json')){D.lastBackup=todayStr;persist();render();toast('バックアップを保存しました')}
}
function importBackup(f){
  const r=new FileReader();r.onload=()=>{let j;try{j=JSON.parse(r.result)}catch(e){toast('このファイルは読み込めません');return}
    if(!j||j.app!=='mainichi-kakeibo'||!j.data||j.data.v!==2){toast('この家計簿のバックアップではありません');return}
    const n=(j.data.entries||[]).length,when=j.exportedAt?mdj(j.exportedAt.slice(0,10)):'';
    const sh=showSheet('<h2>バックアップから戻す</h2><div class="tip">'+(when?when+'に保存した':'')+'バックアップ（記録 '+n+'件）です。<br>今の記録と設定は<b>すべて</b>、この内容に置きかわります。</div><div class="actions"><button type="button" class="btn ghost" id="imNo">やめる</button><button type="button" class="btn" id="imYes">置きかえる</button></div>');
    $('imNo').onclick=closeSheet;
    $('imYes').onclick=()=>{D=j.data;normalize();D.ready=true;closeSheet();persist();state.view='cal';saveView();render();toast('バックアップから戻しました')}};r.readAsText(f);
}

}

(function(){
  const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  if(standalone||!canStore)return;
  let off=false;try{off=localStorage.getItem(KEY+':installOff')==='1'}catch(e){}
  if(off)return;
  const bar=$('installBar'),close=()=>{bar.hidden=true;try{localStorage.setItem(KEY+':installOff','1')}catch(e){}};
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
  if(ios){bar.innerHTML='<span>📲 <b>ホーム画面に追加</b>すると、アプリのように使えて記録も消えにくくなります。Safariの下にある共有ボタン（□に↑）→「ホーム画面に追加」を押してください。</span><button class="x" type="button" aria-label="閉じる">×</button>';bar.hidden=false;bar.querySelector('.x').onclick=close;return}
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();const ev=e;
    bar.innerHTML='<span>📲 <b>ホーム画面に追加</b>すると、アプリのように使えます。</span><button class="b" type="button">追加する</button><button class="x" type="button" aria-label="閉じる">×</button>';bar.hidden=false;
    bar.querySelector('.b').onclick=async()=>{bar.hidden=true;try{ev.prompt();await ev.userChoice}catch(_){}};bar.querySelector('.x').onclick=close});
})();
// オフラインで使えるようにする・新しいバージョンのお知らせ
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const show=w=>{const bar=$('updateBar');bar.innerHTML='<span>新しいバージョンがあります。</span><button class="b" type="button">更新する</button>';bar.hidden=false;
      bar.querySelector('.b').onclick=()=>{w.postMessage('skip')}};
    if(reg.waiting&&navigator.serviceWorker.controller)show(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)show(w)})});
    let done=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(done)return;done=true;location.reload()});
  }).catch(()=>{});
}
})();
</script>
</body>
</html>
